name: KVRN Developer Studio
run-name: ${{ github.ref == 'refs/heads/kvrn-studio-draft' && format('Studio preview {0}', github.sha) || format('Studio production {0}', github.sha) }}
on:
  push:
    branches:
      - kvrn-cp60-source-integration
      - kvrn-studio-draft
permissions:
  contents: read
concurrency:
  group: kvrn-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/kvrn-studio-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kvrn/package-lock.json
      - name: Verify preview cannot claim the live domain
        working-directory: kvrn
        run: node scripts/verify-studio-preview-isolation.mjs
      - name: Build isolated preview (no production secrets)
        working-directory: kvrn
        run: |
          npm ci
          npm run type-check
          npx opennextjs-cloudflare build --config=wrangler.studio-preview.toml
      - name: Deploy preview Worker via dedicated route-free config
        working-directory: kvrn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/verify-studio-preview-isolation.mjs
          npx opennextjs-cloudflare deploy --config=wrangler.studio-preview.toml
  production:
    if: github.ref == 'refs/heads/kvrn-cp60-source-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kvrn/package-lock.json
      - name: Type-check and build
        working-directory: kvrn
        run: |
          npm ci
          npm run type-check
          npm run cf:build
      - name: Deploy production Worker
        working-directory: kvrn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx opennextjs-cloudflare deploy --env=""
