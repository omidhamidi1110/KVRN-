keep_vars = true

# ─── Cloudflare Workers — KVRN ────────────────────────────────────────────────
# Deploy: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
# Secrets (set once via CLI, never stored here):
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put TWILIO_PHONE_NUMBER
#   npx wrangler secret put ADMIN_SECRET
#   npx wrangler secret put EMAIL_FROM
#   npx wrangler secret put CRON_SECRET            # required for /api/internal/transactional-email-retry
#   npx wrangler secret put QA_REPORT_SECRET       # GitHub Actions -> AI QA report
#   npx wrangler secret put CLOUDFLARE_AI_GATEWAY_TOKEN  # AI Gateway auth; AI provider keys should use Gateway BYOK
#   npx wrangler secret put SUPPORT_EMAIL
#   npx wrangler secret put SUPPORT_EMAIL_INGEST_SECRET  # required for support@kvrn.shop → Admin Support
#                                                        # (random, >= 32 chars; authenticates the Email Worker's
#                                                        #  internal POST to /api/internal/support-email-ingest)
#   npx wrangler secret put SUPPORT_FORWARD_TO           # owner mailbox that receives a copy of support@kvrn.shop
#                                                        # mail; MUST be a verified Cloudflare Email Routing
#                                                        # destination. Runtime config only, never committed.
# Cloudflare Email Routing (dashboard, after deploy): route support@kvrn.shop → Worker "kvrn".
# See docs/SUPPORT-INBOX-RUNBOOK.md.
#   npx wrangler secret put ORDERS_EMAIL
#   npx wrangler secret put RETURNS_EMAIL

name       = "kvrn"
main       = "cloudflare-cron-wrapper.js"   # wraps .open-next/worker.js; adds cron handler
account_id = "5c2f1f1df8ff752572878665e985280b"

compatibility_date  = "2024-12-18"
compatibility_flags = ["nodejs_compat"]


# ── Production custom domain ───────────────────────────────────────────────────
[[routes]]
pattern = "kvrn.shop"
custom_domain = true

# ── Static assets ─────────────────────────────────────────────────────────────
[assets]
directory = ".open-next/assets"
binding   = "ASSETS"

# ── Media Library (R2) — ONE-TIME SETUP, NOT ACTIVE UNTIL YOU UNCOMMENT ────────────
# Admin media uploads and the public /media/* route need an R2 bucket bound as KVRN_MEDIA.
# Until the binding exists they fail CLEARLY (HTTP 503 "Media storage is not configured");
# nothing falls back to Neon or local disk. Steps (run once, in this order):
#   1. npx wrangler r2 bucket create kvrn-media
#   2. Uncomment the block below (keep the binding name KVRN_MEDIA exactly).
#   3. Redeploy. No public bucket access / custom domain is needed — the Worker serves /media/*.
# [[r2_buckets]]
# binding     = "KVRN_MEDIA"
# bucket_name = "kvrn-media"

# ── High-risk feature switches (Worker variables; ALL default OFF when unset) ──────
# Do NOT set these here — toml values are overwritten on every deploy. Set them in the
# Cloudflare dashboard (Workers → kvrn → Settings → Variables) one at a time, in the order in
# docs/KVRN-production-setup-migration-rollout-rollback-plan.md. Names:
#   KVRN_FLAG_CMS_PUBLIC_CONTENT, KVRN_FLAG_CMS_PRODUCT_ROUTING, KVRN_FLAG_AFFILIATE_APPLICATIONS,
#   KVRN_FLAG_AFFILIATE_PORTAL, KVRN_FLAG_RADAR_FULFILLMENT_HOLDS, KVRN_FLAG_ABANDONED_CHECKOUT_EMAILS,
#   KVRN_FLAG_MULTI_CURRENCY_CHECKOUT, KVRN_FLAG_AFFILIATE_AUTO_PAYOUTS     (value: on | off)

# ── Cron Triggers — transactional email retry ──────────────────────────────────
# Fires scheduled() in cloudflare-cron-wrapper.js every 5 minutes.
# Enable cron in Cloudflare dashboard after first deployment of V51.4.
# Set CRON_SECRET via: npx wrangler secret put CRON_SECRET
[triggers]
crons = ["*/5 * * * *"]

# ── Public environment variables ───────────────────────────────────────────────
# Secrets must be set via `wrangler secret put` — never hardcode here
[vars]
NEXT_PUBLIC_SITE_URL              = "https://kvrn.shop"
SITE_URL                          = "https://kvrn.shop"
NEXT_PUBLIC_KVRN_SMS_NUMBER       = "+16572149996"
SMS_SIGNUP_DISCOUNT_AMOUNT_CENTS  = "1000"
TWILIO_A2P_APPROVED               = "false"
TWILIO_MARKETING_SEND_ENABLED     = "false"
TWILIO_KEYWORD_DOUBLE_OPTIN_ENABLED = "false"
TWILIO_SIGNUP_ENABLED = "false"
KVRN_SMS_POLICY_PUBLIC_ENABLED = "false"
NEXT_PUBLIC_SMS_SIGNUP_ENABLED = "false"
ENABLE_STRIPE_TEST_CHECKOUT       = "false"
NODE_ENV                          = "production"
# AI OS defaults are intentionally OFF until the staged rollout checklist is completed.
AI_ENABLED                        = "false"
AI_CHIEF_NOTIFICATION_GATE        = "false"
AI_WEB_RESEARCH_ENABLED            = "false"
AI_EXTERNAL_SYNC_ENABLED           = "false"
AI_EXTERNAL_BUDGET_CAP_CONFIRMED  = "false"
AI_EXTERNAL_BUDGET_CAP_USD        = "5"
AI_GATEWAY_USE_STORED_KEYS        = "true"
AI_ANTHROPIC_BASE_URL            = "https://gateway.ai.cloudflare.com/v1/5c2f1f1df8ff752572878665e985280b/kvrn-ai-prod/anthropic"
AI_OPENAI_BASE_URL               = "https://gateway.ai.cloudflare.com/v1/5c2f1f1df8ff752572878665e985280b/kvrn-ai-prod/openai"
AI_GOOGLE_BASE_URL               = "https://gateway.ai.cloudflare.com/v1/5c2f1f1df8ff752572878665e985280b/kvrn-ai-prod/google-ai-studio"
