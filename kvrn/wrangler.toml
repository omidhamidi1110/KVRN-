keep_vars = true

# ─── Cloudflare Workers — KVRN ────────────────────────────────────────────────
# Deploy: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
# Secrets (set once via CLI, never stored here):
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put TWILIO_PHONE_NUMBER
#   npx wrangler secret put ADMIN_SECRET
#   npx wrangler secret put EMAIL_FROM
#   npx wrangler secret put CRON_SECRET            # required for /api/internal/transactional-email-retry
#   npx wrangler secret put SUPPORT_EMAIL
#   npx wrangler secret put ORDERS_EMAIL
#   npx wrangler secret put RETURNS_EMAIL

name       = "kvrn"
main       = "cloudflare-cron-wrapper.js"   # wraps .open-next/worker.js; adds cron handler
account_id = "5c2f1f1df8ff752572878665e985280b"

compatibility_date  = "2024-12-18"
compatibility_flags = ["nodejs_compat"]


# ── Production custom domain ───────────────────────────────────────────────────
[[routes]]
pattern = "kvrn.shop"
custom_domain = true

# ── Static assets ─────────────────────────────────────────────────────────────
[assets]
directory = ".open-next/assets"
binding   = "ASSETS"

# ── Cron Triggers — transactional email retry ──────────────────────────────────
# Fires scheduled() in cloudflare-cron-wrapper.js every 5 minutes.
# Enable cron in Cloudflare dashboard after first deployment of V51.4.
# Set CRON_SECRET via: npx wrangler secret put CRON_SECRET
[triggers]
crons = ["*/5 * * * *"]

# ── Public environment variables ───────────────────────────────────────────────
# Secrets must be set via `wrangler secret put` — never hardcode here
[vars]
NEXT_PUBLIC_SITE_URL              = "https://kvrn.shop"
SITE_URL                          = "https://kvrn.shop"
NEXT_PUBLIC_KVRN_SMS_NUMBER       = "+16572149996"
SMS_SIGNUP_DISCOUNT_AMOUNT_CENTS  = "1000"
TWILIO_A2P_APPROVED               = "false"
TWILIO_MARKETING_SEND_ENABLED     = "false"
ENABLE_STRIPE_TEST_CHECKOUT       = "false"
NODE_ENV                          = "production"

# ── Production ────────────────────────────────────────────────────────────────
[env.production]
name = "kvrn"

[env.production.vars]
NEXT_PUBLIC_SITE_URL              = "https://kvrn.shop"
SITE_URL                          = "https://kvrn.shop"
NEXT_PUBLIC_KVRN_SMS_NUMBER       = "+16572149996"
SMS_SIGNUP_DISCOUNT_AMOUNT_CENTS  = "1000"
TWILIO_A2P_APPROVED               = "false"
TWILIO_MARKETING_SEND_ENABLED     = "false"
ENABLE_STRIPE_TEST_CHECKOUT       = "false"
NODE_ENV                          = "production"

# ── Preview / staging ─────────────────────────────────────────────────────────
[env.preview]
name = "kvrn-preview"

[env.preview.vars]
NEXT_PUBLIC_SITE_URL = "https://kvrn.omidhamidi1110.workers.dev"
NODE_ENV             = "production"
